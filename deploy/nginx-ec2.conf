server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 98.86.198.226 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kyu-portal/dist;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://98.86.198.226$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 98.86.198.226 _;

    ssl_certificate /etc/letsencrypt/live/98.86.198.226/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/98.86.198.226/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    root /var/www/kyu-portal/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 15M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/kyu-portal/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/kyu-portal/backend/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
